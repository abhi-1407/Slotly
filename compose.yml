services:
  postgres:
    image: postgres:17
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: spotly
      POSTGRES_PASSWORD: spotly_password
      POSTGRES_DB: spotly
    volumes:
      - spotly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotly -d spotly"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  spotly_pgdata: